<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venus Hub</title>
<script>
const ico = (n, c) => '<svg class="i' + (c ? ' ' + c : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
/* Dark mode: use the Tracker's own switch (localStorage "darkMode"); if never set, follow the OS */
(function(){ function apply(){ try{ var v=localStorage.getItem('darkMode'); var d = v==='true' || (v===null && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.classList.toggle('dark-mode', d); }catch(e){} }
  apply(); window.addEventListener('storage', apply); })();
</script>
<style>
/* Same "Sakura Mist" palette as the Tracker; dark mode follows the Tracker's own dark-mode switch */
:root{
  --primary:#d17b96; --primary-light:#fbe4ea; --primary-dark:#a85870;
  --bg-light:#faf3f6; --bg-white:#fffbfc; --text-dark:#4a3240; --text-muted:#9a7686; --border-color:#f0d7de;
  --ok:#4f8a6b; --warn:#c0762f; --bad:#b94a5a; --bad-soft:#fbe9ec; --warn-soft:#fdf1e3; --ok-soft:#e8f4ee;
  --bg:var(--bg-light); --card:var(--bg-white); --ink:var(--text-dark); --muted:var(--text-muted);
  --line:var(--border-color); --accent:var(--primary); --accent-soft:var(--primary-light);
}
:root.dark-mode{
  --primary:#f0a8c4; --primary-light:#4a2e3c; --primary-dark:#f8d0e0;
  --bg-light:#180f16; --bg-white:#1e141c; --text-dark:#f3e4ec; --text-muted:#b898a8; --border-color:#3a2530;
  --ok:#7fc3a0; --warn:#e0a05f; --bad:#e58898; --bad-soft:#3a1f27; --warn-soft:#3a2d1c; --ok-soft:#1d3329;
}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex-shrink:0}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
a.app{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:18px;
  transition:transform .15s,border-color .15s,box-shadow .15s}
a.app:hover,a.app:focus-visible{transform:translateY(-2px);border-color:var(--accent);
  box-shadow:0 6px 18px rgba(181,103,154,.15);outline:none}
.ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.name{font-weight:650}
.desc{color:var(--muted);font-size:.9rem;margin-top:2px}
.meta{font-size:.8rem;color:var(--muted);margin-top:10px}
h2{font-size:1.05rem;margin:32px 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.btn{margin-left:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:3px 12px;font:inherit;font-size:.85rem;cursor:pointer}
a.btn{text-decoration:none;display:inline-block}
.row.sub{font-size:.85rem;opacity:.8}
.tip{font-size:.85rem;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><symbol id="i-alarm-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" /> <path d="M12 9v4l2 2" /> <path d="M5 3 2 6" /> <path d="m22 6-3-3" /> <path d="M6.38 18.7 4 21" /> <path d="M17.64 18.67 20 21" /></symbol><symbol id="i-square-check" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /> <path d="m9 12 2 2 4-4" /></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><path d="M8 2v4" /> <path d="M16 2v4" /> <rect width="18" height="18" x="3" y="4" rx="2" /> <path d="M3 10h18" /></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0" /> <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></symbol><symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" /></symbol><symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></symbol><symbol id="i-trending-up" viewBox="0 0 24 24"><path d="M16 7h6v6" /> <path d="m22 7-8.5 8.5-5-5L2 17" /></symbol><symbol id="i-coins" viewBox="0 0 24 24"><path d="M13.744 17.736a6 6 0 1 1-7.48-7.48" /> <path d="M15 6h1v4" /> <path d="m6.134 14.768.866-.5 2 3.464" /> <circle cx="16" cy="8" r="6" /></symbol><symbol id="i-calculator" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2" /> <line x1="8" x2="16" y1="6" y2="6" /> <line x1="16" x2="16" y1="14" y2="18" /> <path d="M16 10h.01" /> <path d="M12 10h.01" /> <path d="M8 10h.01" /> <path d="M12 14h.01" /> <path d="M8 14h.01" /> <path d="M12 18h.01" /> <path d="M8 18h.01" /></symbol><symbol id="i-target" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 8 2a6 6 0 0 0 3.6-1.2A1 1 0 0 1 21 3.6a1 1 0 0 1 .4.8v10.2a1 1 0 0 1-.4.8A6 6 0 0 1 17 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.4z" /></symbol></svg>
<div class="wrap">
  <h1>Venus Hub</h1>
  <p class="sub">Pick an app to open. All apps share the same data store.</p>

  <!-- To add a new app: copy one line in the APPS list below -->
  <div class="grid" id="apps"></div>

  <h2>Data health</h2>
  <div class="panel" id="health">Checking…</div>
  <p class="tip">"Back up now" opens the Tracker and asks you to confirm, then downloads one file with everything (Tracker, Notes, Loan Ledger). Keep a copy on Google Drive or another device.</p>
</div>

<script>
/* ===== APP LIST — edit only this part ===== */
const APPS = [
  { name:"Today",                 icon:"target", desc:"Deadlines, to-dos, reminders due now", url:"./today.html" },
  { name:"Finance Career Tracker", icon:"trending-up", desc:"Main tracker: study, habits, notes…", url:"./index.html" },
  { name:"Loan Ledger",            icon:"coins", desc:"Loan tracking ledger",                url:"../Loan-Ledger/" },
  { name:"Finance Valuation Tools",icon:"calculator", desc:"WACC, CAPM, Black-Scholes…",           url:"../finance-valuation-tools/" }
];

const $ = id => document.getElementById(id);
$("apps").innerHTML = APPS.map(a =>
  `<a class="app" href="${a.url}"><div class="ico">${ico(a.icon)}</div>
   <div class="name">${a.name}</div><div class="desc">${a.desc}</div></a>`).join("");

function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ago(ts){
  if(!ts) return {t:"no record yet", c:"warn", none:true};
  const d = Math.floor((Date.now()-ts)/864e5);
  const t = d===0 ? "today" : d+(d===1?" day ago":" days ago");
  return {t, c: d<=7 ? "ok" : d<=14 ? "warn" : "bad"};
}

async function health(){
  const rows = [];
  // localStorage usage estimate (~5MB limit)
  let bytes = 0;
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); bytes += (k.length+(localStorage.getItem(k)||"").length)*2; } }catch(e){}
  const mb = bytes/1048576, pct = Math.min(100, mb/5*100);
  const cls = pct>85 ? "bad" : pct>65 ? "warn" : "ok";
  rows.push(`<div><div class="row"><span>localStorage usage (limit ~5MB)</span><span class="${cls}">${mb.toFixed(2)} MB (${pct.toFixed(0)}%)</span></div>
    <div class="bar"><i style="width:${pct}%;background:var(--${cls==='ok'?'ok':cls==='warn'?'warn':'bad'})"></i></div></div>`);

  // Full backup (the one that matters: Tracker + Notes + Loan Ledger + everything else in this data store)
  const fb = ago(+ls("lastFullBackupAt")||0);
  const fbMsg = fb.none ? "no backup recorded yet" : fb.t;
  rows.push(`<div class="row"><span><b>Last full backup</b></span><span class="${fb.none ? 'bad' : fb.c}">${fbMsg} <a class="btn" href="./index.html?backup=1">${ico("download")} Back up now</a></span></div>`);
  // Optional separate exports (already included in a full backup, so shown muted)
  const nv = ago(+ls("nvLastBackup")||0), ll = ago(+ls("loanLedger.lastExport")||0);
  rows.push(`<div class="row sub"><span>Notes export (also in full backup)</span><span>${nv.t}</span></div>`);
  rows.push(`<div class="row sub"><span>Loan Ledger export (also in full backup)</span><span>${ll.t}</span></div>`);

  // Persistent storage
  let persisted = null;
  try{ if(navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted(); }catch(e){}
  const ptxt = persisted===null ? "not supported by this browser" : persisted ? "Enabled" : "Not enabled";
  const btn = (persisted===false) ? ` <button id="persistBtn" class="btn">Enable protection</button>` : "";
  rows.push(`<div class="row"><span>Protection from browser auto-cleanup</span><span class="${persisted?'ok':'warn'}">${ptxt}${btn}</span></div>`);

  $("health").innerHTML = rows.join("");
  const pb = $("persistBtn");
  if(pb) pb.onclick = async () => {
    try{
      const g = await navigator.storage.persist();
      alert(g ? "Data protection enabled" : "The browser did not grant it this time. Bookmark this page and try again later.");
    }catch(e){ alert("Could not enable it in this browser."); }
    health();
  };
}
health();
</script>
</body>
</html>
